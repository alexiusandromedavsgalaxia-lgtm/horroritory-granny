<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Horroritory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Horroritory"></canvas>
    <section id="hud">
      <div id="mode">NORMAL</div>
      <div id="objective">Encuentra una salida.</div>
      <div id="inventory"></div>
    </section>
    <section id="menu">
      <h1>HORRORITORY</h1>
      <p>escapa de la casa</p>
      <label>Modo<select id="difficulty"></select></label>
      <button id="start">EMPEZAR</button>
      <p class="small">WASD / flechas · E interactuar · R reiniciar</p>
    </section>
    <section id="mobile">
      <div id="stick"><i></i></div>
      <button id="interact">E</button>
      <button id="run">RUN</button>
    </section>
    <section id="ending" class="hidden">
      <div class="panel"><h2 id="endingTitle"></h2><p id="endingText"></p><button id="again">OTRA PARTIDA</button></div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
